name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Package release tarball
        run: |
          mkdir -p release/db-diff
          cp -r dist release/db-diff/dist
          cp package.json package-lock.json README.md release/db-diff/
          tar -czf db-diff-${GITHUB_REF_NAME}.tar.gz -C release db-diff

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: db-diff-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
